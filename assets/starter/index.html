<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星环信标</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #060a10; }
    body { display: grid; place-items: center; overflow: hidden; color: #ebf2f9; }
    canvas { display: block; width: 100%; height: 100%; }
    #error { position: absolute; inset: auto 1rem 1rem; font: 1rem system-ui; }
  </style>
</head>
<body>
  <canvas id="film" aria-label="星环信标三维短片"></canvas>
  <output id="error" role="status"></output>
  <script type="module">
    import('./film.js').catch(error => {
      window.filmError = error.message;
      document.querySelector('#error').textContent = error.message;
      console.error(error);
    });
  </script>
</body>
</html>
